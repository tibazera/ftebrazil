<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Jogando — FTE Brazil</title>
  <link rel="stylesheet" href="play.css?v=11">

<body>
  <main>
    <a href="../" class="exit" id="exit" hidden>← Sair da arena</a>

    </section>
  </main>
  <script src="play.js?v=11"></script>
