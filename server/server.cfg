// Servidor FTE Brazil: deathmatch com o conteúdo shareware (id1/pak0.pak).
hostname "FTE Brazil | São Paulo"
sv_public 1
maxclients 16
deathmatch 1
teamplay 0
timelimit 15
fraglimit 30

// UDP para clientes desktop (porta padrão do QuakeWorld).
sv_port 27500
// TCP na mesma porta para navegadores. O Caddy termina o TLS (wss://) e repassa para cá.
sv_port_tcp 27500
net_enable_websockets 1
net_enable_http 0
net_enable_tls 0

// O padrão do FTE reserva 131072 entidades e não cabe em VPS pequeno
// ("Fatal error: Out of memory"). Deathmatch usa poucas centenas.
pr_maxedicts 4096
pr_ssqc_memsize 33554432

// Mapas do episódio 1, os únicos que vêm no shareware.
map e1m1
